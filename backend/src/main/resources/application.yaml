spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  
server:
  port: 8080
  forward-headers-strategy: native

security:
  jwt:
    secret: "my-super-secret-key-for-jwt-123456"
    expiration-ms: 7200000 # 2 hours in milliseconds


---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:postgresql://localhost:5433/assessment_system
    username: devuser
    password: devpass123

---
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:postgresql://db:5432/assessment_system
    username: devuser
    password: devpass123

---
twilio:
  accountSid: ${TWILIO_ACCOUNT_SID}
  authToken: ${TWILIO_AUTH_TOKEN}
  whatsapp:
    from: ${TWILIO_WHATSAPP_FROM}
